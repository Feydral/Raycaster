[package]
name = "raycaster"
version = "0.1.0"
edition = "2024"

[features]
default = ["termcanvas"]
termcanvas = ["dep:termcanvas", "dep:crossterm"]
nanofb = ["dep:nanofb"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }
glam = "0.33.1"
nanofb = { version = "0.2.0", optional = true }
termcanvas = { version = "0.1.6", optional = true }
